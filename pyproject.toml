[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iosforensic"
version = "1.0.0"
description = "Suite di acquisizione forense logica per dispositivi iOS"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "vo10288" }]
keywords = ["forensics", "ios", "dfir", "libimobiledevice", "tsurugi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
iosforensic = "iosforensic.cli:main"

[project.urls]
Homepage = "https://github.com/vo10288/iOsMobForensic"
Issues = "https://github.com/vo10288/iOsMobForensic/issues"

[tool.setuptools.packages.find]
include = ["iosforensic*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
